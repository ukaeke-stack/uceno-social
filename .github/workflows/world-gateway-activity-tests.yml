name: World Gateway Activity Tests

on:
  push:
    branches:
      - feature/uceno-unity-foundation
    paths:
      - "runtime/world-gateway/src/**"
      - "runtime/world-gateway/tests/**"
      - "runtime/world-gateway/package.json"
      - "runtime/world-gateway/tsconfig.json"
      - "db/migrations/029_*.sql"
      - "db/migrations/030_*.sql"
      - "db/migrations/031_*.sql"
      - "db/migrations/032_*.sql"
      - "db/migrations/033_*.sql"
      - "db/migrations/034_*.sql"
      - "db/migrations/029_*.sql"
      - "db/migrations/030_*.sql"
      - "db/migrations/031_*.sql"
      - "db/migrations/032_*.sql"
      - "db/migrations/033_*.sql"
      - "db/migrations/034_*.sql"
      - ".github/workflows/world-gateway-activity-tests.yml"
  pull_request:
    paths:
      - "runtime/world-gateway/src/**"
      - "runtime/world-gateway/tests/**"
      - "runtime/world-gateway/package.json"
      - "runtime/world-gateway/tsconfig.json"
      - ".github/workflows/world-gateway-activity-tests.yml"

permissions:
  contents: read

jobs:
  activity-domain:
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    name: Compile gateway and test activity state machine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/world-gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile TypeScript and run activity tests
        run: npm run test:activity
