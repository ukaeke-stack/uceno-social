name: UCENO Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name (for example 1.0.0)
        required: true
        type: string
      version_code:
        description: Positive integer greater than every previous release version code
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check required secrets and release inputs
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || '1000' }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          test -n "$FIREBASE_JSON" || (echo "::error::Missing FIREBASE_GOOGLE_SERVICES_JSON secret"; exit 1)
          test -n "$KEYSTORE" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD secret"; exit 1)
          node <<'NODE'
          const code = process.env.VERSION_CODE ?? '';
          const name = process.env.VERSION_NAME ?? '';
          if (!/^[0-9]+$/.test(code)) throw new Error('version_code must contain digits only');
          const n = Number(code);
          if (!Number.isSafeInteger(n) || n < 1 || n > 2100000000) {
            throw new Error('version_code must be an integer between 1 and 2100000000');
          }
          if (!/^[0-9]+(?:\.[0-9]+){1,3}(?:[-+][0-9A-Za-z.-]+)?$/.test(name)) {
            throw new Error('version_name must look like 1.0.0 or 1.0.0-beta.1');
          }
          NODE

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Firebase
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$FIREBASE_JSON" > android/app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))"

      - name: Configure Google Services and release version
        env:
          VERSION_CODE: ${{ inputs.version_code || '1000' }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const code = Number(process.env.VERSION_CODE);
          const name = process.env.VERSION_NAME;
          if (!Number.isSafeInteger(code) || code < 1 || code > 2100000000) {
            throw new Error('Invalid version code');
          }
          if (!/^[0-9]+(?:\.[0-9]+){1,3}(?:[-+][0-9A-Za-z.-]+)?$/.test(name ?? '')) {
            throw new Error('Invalid version name');
          }

          const root = 'android/build.gradle';
          let r = fs.readFileSync(root, 'utf8');
          if (!r.includes('com.google.gms:google-services')) {
            if (!r.includes('dependencies {')) throw new Error('Google Services Gradle dependency block not found');
            r = r.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'");
            fs.writeFileSync(root, r);
          }

          const file = 'android/app/build.gradle';
          let a = fs.readFileSync(file, 'utf8');
          if (!a.includes("com.google.gms.google-services")) a += "\napply plugin: 'com.google.gms.google-services'\n";
          if (!/versionCode\s+\d+/.test(a)) throw new Error('Android versionCode setting not found');
          if (!/versionName\s+["'][^"']+["']/.test(a)) throw new Error('Android versionName setting not found');
          a = a.replace(/versionCode\s+\d+/, 'versionCode ' + code);
          a = a.replace(/versionName\s+["'][^"']+["']/, 'versionName "' + name + '"');
          fs.writeFileSync(file, a);
          NODE

      - name: Decode signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Normalize whitespace in pasted Base64 secrets before decoding.
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/uceno-release.keystore"
          test -s "$RUNNER_TEMP/uceno-release.keystore" || (echo "::error::Decoded keystore is empty"; exit 1)
          # Validate the decoded keystore without printing private key material.
          keytool -list -keystore "$RUNNER_TEMP/uceno-release.keystore" -storepass "$STORE_PASSWORD" >/dev/null
          echo "Signing keystore decoded and validated successfully."

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/uceno-release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER" || (echo "::error::Android apksigner tool was not found"; exit 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK signature verification passed."

      - name: Prepare versioned APK filename
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/uceno-android-v${VERSION_NAME}-code-${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: uceno-android-release-${{ inputs.version_name }}-code-${{ inputs.version_code }}
          path: android/app/build/outputs/apk/release/uceno-android-v${{ inputs.version_name }}-code-${{ inputs.version_code }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: UCENO Android v${{ inputs.version_name }}
          body: |
            UCENO Android release v${{ inputs.version_name }}.

            Version code: ${{ inputs.version_code }}
            Package ID: com.ukaeke.uceno

            Install this APK over your existing UCENO installation. Do not uninstall first.
            Android will ask you to approve the installation.
          files: android/app/build/outputs/apk/release/uceno-android-v${{ inputs.version_name }}-code-${{ inputs.version_code }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
