name: UCENO SolsticeBay architecture GLB pilot import

on:
  workflow_dispatch:
    inputs:
      acquisition_run_id:
        description: "Successful city architecture acquisition workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: uceno-city-architecture-pilot-import
  cancel-in-progress: false

jobs:
  import-one-real-glb:
    if: ${{ vars.UCENO_UNITY_CONTENT_EXPORT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          lfs: true

      - name: Download the selected acquisition run artifact
        uses: actions/download-artifact@v4
        with:
          name: uceno-city-architecture-source-acquisition
          run-id: ${{ inputs.acquisition_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/uceno-city-architecture-source-acquisition

      - name: Select the manifest-pinned SolsticeBay LOD0 candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find acquisition -type f -name tevy-acquisition-manifest.json -print -quit)"
          test -n "$manifest"
          python - "$manifest" "$RUNNER_TEMP/uceno-city-architecture-source-acquisition" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, os, pathlib, shutil, sys
          manifest_path, acquisition_root, output_path = map(pathlib.Path, sys.argv[1:])
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          city = data.get("cities", {}).get("SolsticeBay", {})
          candidates = city.get("selected_and_acquired", [])
          if not candidates:
              raise SystemExit("Manifest contains no acquired SolsticeBay building.")
          candidate = candidates[0]
          lod0 = next((x for x in candidate.get("lods", []) if x.get("lod") == 0), None)
          if not lod0 or not lod0.get("file") or not lod0.get("sha256"):
              raise SystemExit("Selected SolsticeBay candidate has no manifest-pinned LOD0 file/checksum.")
          expected = str(lod0["sha256"]).lower()
          if len(expected) != 64:
              raise SystemExit("Manifest LOD0 SHA-256 is malformed.")
          matches = list(acquisition_root.rglob(pathlib.Path(lod0["file"]).name))
          matches = [p for p in matches if p.as_posix().endswith("/" + lod0["file"].replace("\\\\", "/"))]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one file for {lod0['file']}; found {len(matches)}.")
          source = matches[0]
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          if digest != expected:
              raise SystemExit(f"Acquired LOD0 checksum mismatch: manifest={expected}, file={digest}")
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "uceno-solsticebay-lod0.glb"
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, destination)
          with pathlib.Path(output_path).open("a", encoding="utf-8") as out:
              out.write(f"path={destination.resolve()}\n")
              out.write(f"sha256={expected}\n")
              out.write(f"candidate={candidate.get('name') or candidate.get('slug')}\n")
          (destination.parent / "SHA256SUMS").write_text(f"{expected}  solsticebay-lod0.glb\n", encoding="utf-8")
          print(f"Selected manifest-pinned candidate: {candidate.get('name')} ({candidate.get('slug')})")
          PY

      - name: Run Unity Editor import-only pilot
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UCENO_PILOT_GLB: ${{ steps.candidate.outputs.path }}
          UCENO_PILOT_EXPECTED_SHA256: ${{ steps.candidate.outputs.sha256 }}
          UCENO_PILOT_CANDIDATE_NAME: ${{ steps.candidate.outputs.candidate }}
          UCENO_PILOT_REPORT: ${{ runner.temp }}/uceno-solsticebay-glb-import-report.json
        with:
          projectPath: unity/UCENOVirtualWorld
          unityVersion: 6000.3.27f1
          targetPlatform: StandaloneLinux64
          buildMethod: UCENO.VirtualWorld.Editor.ArchitecturePilotImport.Run
          buildsPath: Builds/ArchitecturePilot
          buildName: uceno-solsticebay-import-only

      - name: Verify the technical import report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/uceno-solsticebay-glb-import-report.json"
          test -s "$report"
          python - "$report" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("status") == "technical-import-pass-visual-review-pending", data
          assert data.get("meshCount", 0) > 0, data
          assert data.get("rendererCount", 0) > 0, data
          assert data.get("triangleCount", 0) > 0, data
          assert data.get("materialCount", 0) > 0, data
          assert data.get("textureCount", 0) > 0, data
          print(json.dumps(data, indent=2))
          PY

      - name: Upload pilot input, import report and Editor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uceno-solsticebay-unity-import-pilot
          path: |
            ${{ runner.temp }}/uceno-solsticebay-lod0.glb
            ${{ runner.temp }}/uceno-solsticebay-glb-import-report.json
          if-no-files-found: warn
          retention-days: 30
