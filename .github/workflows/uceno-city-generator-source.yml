name: UCENO Nine-City Imported Art Release Gate

on:
  push:
    branches:
      - feature/uceno-unity-foundation
    paths:
      - 'runtime/world-gateway/config/world-cities.json'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/CityProceduralAssetPackGenerator.cs'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/ImportedCityAssetPackGate.cs'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldCityScenePipeline.cs'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/city-scene-asset-profiles.json'
      - 'docs/virtual-world/NINE_CITY_SCENE_PIPELINE.md'
      - 'scripts/validate_uceno_city_generator.py'
      - '.github/workflows/uceno-city-generator-source.yml'
  pull_request:
    paths:
      - 'runtime/world-gateway/config/world-cities.json'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/CityProceduralAssetPackGenerator.cs'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/ImportedCityAssetPackGate.cs'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldCityScenePipeline.cs'
      - 'unity/UCENOVirtualWorld/Assets/UCENO/Editor/city-scene-asset-profiles.json'
      - 'docs/virtual-world/NINE_CITY_SCENE_PIPELINE.md'
      - 'scripts/validate_uceno_city_generator.py'
      - '.github/workflows/uceno-city-generator-source.yml'

permissions:
  contents: read

jobs:
  city-art-source:
    name: Validate imported city art release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate city catalogue, imported art gate and scene pipeline
        run: python scripts/validate_uceno_city_generator.py
