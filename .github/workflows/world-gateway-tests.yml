name: UCENO World Gateway Tests

on:
  pull_request:
    paths:
      - "runtime/world-gateway/**"
      - ".github/workflows/world-gateway-tests.yml"
  push:
    branches:
      - "feature/uceno-unity-foundation"
    paths:
      - "runtime/world-gateway/**"
      - ".github/workflows/world-gateway-tests.yml"

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uceno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uceno_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/uceno_test
    defaults:
      run:
        working-directory: runtime/world-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gateway dependencies
        run: npm install --no-package-lock
      - name: Compile gateway and run policy/session tests
        run: npm run test:activity
