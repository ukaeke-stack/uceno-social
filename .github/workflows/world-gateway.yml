name: UCENO World Gateway and Unity Client
on:
  pull_request:
    paths:
      - ".github/workflows/world-gateway.yml"
      - "runtime/world-gateway/**"
      - "db/migrations/024_virtual_world_instance_leases.sql"
      - "app/api/worlds/**"
      - "lib/world-client-session.ts"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Scripts/**"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/**"
      - "unity/UCENOVirtualWorld/Packages/manifest.json"
  push:
    branches:
      - feature/uceno-unity-foundation
    paths:
      - ".github/workflows/world-gateway.yml"
      - "runtime/world-gateway/**"
      - "db/migrations/024_virtual_world_instance_leases.sql"
      - "app/api/worlds/**"
      - "lib/world-client-session.ts"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Scripts/**"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/**"
      - "unity/UCENOVirtualWorld/Packages/manifest.json"
jobs:
  gateway-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/world-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  unity-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Unity package manifest
        run: |
          node -e "const p=require('./unity/UCENOVirtualWorld/Packages/manifest.json'); if (!p.dependencies || !p.dependencies['com.endel.nativewebsocket']) process.exit(1);"
      - name: Verify collision configuration and server resolution
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const gateway = fs.readFileSync('./runtime/world-gateway/src/server.ts', 'utf8');
          for (const marker of ['WORLD_OBJECT_STATE_FILE', 'restorePersistentObjectStates', 'persistObjectStates', 'renameSync', 'state_persistence_failed'])
            if (!gateway.includes(marker)) throw new Error('Missing durable world-object state behavior: ' + marker);
          for (const marker of ['const previousState = target.state', 'target.state = previousState', 'target.actorId = previousActorId'])
            if (!gateway.includes(marker)) throw new Error('Missing interaction rollback on persistence failure: ' + marker);
          for (const marker of ['WORLD_COLLISION_BOXES_FILE', 'readFileSync', 'loadCollisionBoxes', 'PLAYER_RADIUS', 'PLAYER_HEIGHT', 'resolveHorizontalMovement', 'overlapsBox'])
            if (!gateway.includes(marker)) throw new Error('Missing server collision behavior: ' + marker);
          if (!gateway.includes('COLLISION_BOXES.some'))
            throw new Error('Server movement is not checked against configured collision boxes');
          for (const marker of ['loadInteractables', 'type === "interact"', 'distance > 4.25', 'object_state', 'target.kind === "seat"', 'seat_occupied', 'releaseSeats', 'item.occupantId === player.id'])
            if (!gateway.includes(marker)) throw new Error('Missing authoritative interaction validation: ' + marker);
          const objectScript = fs.readFileSync('./unity/UCENOVirtualWorld/Assets/UCENO/Scripts/WorldInteractable.cs', 'utf8');
          const interactor = fs.readFileSync('./unity/UCENOVirtualWorld/Assets/UCENO/Scripts/WorldObjectInteractor.cs', 'utf8');
          const client = fs.readFileSync('./unity/UCENOVirtualWorld/Assets/UCENO/Scripts/WorldGatewayClient.cs', 'utf8');
          for (const marker of ['ApplyServerState', 'doorPivot', 'OccupantId']) if (!objectScript.includes(marker)) throw new Error('Missing interactable state behavior: ' + marker);
          for (const marker of ['Physics.Raycast', 'KeyCode.E', 'RequestInteraction', '"SIT"', '"STAND"']) if (!interactor.includes(marker)) throw new Error('Missing interaction targeting: ' + marker);
          for (const marker of ['RequestInteraction', 'object_state', 'objectState', 'occupantId', 'SetSeated', 'LocalUserId']) if (!client.includes(marker)) throw new Error('Missing client interaction transport: ' + marker);
          if (!gateway.includes('Array.isArray((parsed as { boxes?: unknown }).boxes)'))
            throw new Error('Gateway does not accept the Unity-exported collision map format');
          const authoring = fs.readFileSync('./unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldInteractableAuthoring.cs', 'utf8');
          for (const marker of ['Mark Selected as Door', 'Mark Selected as Seat', 'Mark Selected as Usable Object', 'WorldCollisionGeometryExporter.Export'])
            if (!authoring.includes(marker)) throw new Error('Missing Unity interactable authoring tool: ' + marker);
          const exporter = fs.readFileSync('./unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldCollisionGeometryExporter.cs', 'utf8');
          for (const marker of ['GetComponentsInChildren<Collider>', 'collider.bounds', 'uceno-city-collision-boxes.json'])
            if (!exporter.includes(marker)) throw new Error('Missing Unity geometry export behavior: ' + marker);
          console.log('Static collision configuration and movement-resolution source checks passed.');
          NODE
      - name: Verify authoritative client wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const root = './unity/UCENOVirtualWorld/Assets/UCENO/Scripts/';
          const gateway = fs.readFileSync(root + 'WorldGatewayClient.cs', 'utf8');
          const motor = fs.readFileSync(root + 'PlayerMotor.cs', 'utf8');
          const presence = fs.readFileSync(root + 'WorldPresenceClient.cs', 'utf8');
          const animation = fs.readFileSync(root + 'AvatarLocomotionDriver.cs', 'utf8');
          for (const marker of ['OnMessage', 'SendText', 'DispatchMessageQueue', 'ApplyServerState', 'SetServerAuthority'])
            if (!gateway.includes(marker)) throw new Error('Missing gateway behavior: ' + marker);
          for (const marker of ['SetServerAuthority', 'ConsumeJumpRequest', 'ApplyServerState'])
            if (!motor.includes(marker)) throw new Error('Missing motor behavior: ' + marker);
          if (!presence.includes('AddComponent<WorldGatewayClient>()'))
            throw new Error('WorldPresenceClient does not attach the gateway transport');
          for (const marker of ['ApplyRemoteState', 'IsSeated', 'Wave', 'Cheer'])
            if (!animation.includes(marker)) throw new Error('Missing remote avatar animation support: ' + marker);
          console.log('Unity package and gateway wiring checks passed. This is not a Unity Editor/Android build.');
          NODE
