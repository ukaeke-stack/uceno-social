name: UCENO nine-city architecture source discovery
on:
  workflow_dispatch:
  push:
    branches: [feature/uceno-unity-foundation]
    paths:
      - "scripts/discover-city-architecture.py"
      - ".github/workflows/uceno-city-architecture-discovery.yml"
permissions:
  contents: read
concurrency:
  group: uceno-city-architecture-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query live realistic CC0 architecture catalogue
        run: python scripts/discover-city-architecture.py
      - name: Publish candidate records for review
        uses: actions/upload-artifact@v4
        with:
          name: uceno-nine-city-architecture-candidates
          path: artifacts/city-architecture-candidates/
          if-no-files-found: error
          retention-days: 30
