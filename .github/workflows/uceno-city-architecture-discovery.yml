name: UCENO nine-city architecture source discovery and acquisition
on:
  workflow_dispatch:
  push:
    branches: [feature/uceno-unity-foundation]
    paths:
      - "scripts/discover-city-architecture.py"
      - "scripts/acquire-city-architecture.py"
      - ".github/workflows/uceno-city-architecture-discovery.yml"
permissions:
  contents: read
concurrency:
  group: uceno-city-architecture-discovery
  cancel-in-progress: true
jobs:
  discover-and-acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query live realistic CC0 architecture catalogue
        run: python scripts/discover-city-architecture.py
      - name: Download and verify first-batch city architecture GLBs
        run: python scripts/acquire-city-architecture.py
      - name: Preserve discovery and partial acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uceno-nine-city-architecture-acquisition
          path: |
            artifacts/city-architecture-candidates/
            artifacts/city-architecture-models/
          if-no-files-found: warn
          retention-days: 30
