name: Import UCENO free environment assets

on:
  pull_request:
    branches:
      - feature/uceno-unity-foundation
    types: [opened, reopened]
    paths:
      - 'scripts/UCENO_ENV_ASSET_IMPORT.md'

permissions:
  contents: write

concurrency:
  group: uceno-free-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-environment:
    name: Download CC0 city models, PBR surfaces and HDRI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and validate Poly Haven CC0 assets
        run: |
          python -m py_compile scripts/download_polyhaven_assets.py
          python scripts/download_polyhaven_assets.py \
            --output-dir unity/UCENOVirtualWorld/Assets/UCENO/Environment/Imported

      - name: Commit environment assets to the feature branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity/UCENOVirtualWorld/Assets/UCENO/Environment/Imported
          if git diff --cached --quiet; then
            echo "No new environment assets to commit."
            exit 0
          fi
          git commit -m "Import CC0 city models, PBR surfaces and HDRI"
          git fetch origin "${BRANCH_NAME}"
          git rebase "origin/${BRANCH_NAME}"
          git push origin "HEAD:${BRANCH_NAME}"
