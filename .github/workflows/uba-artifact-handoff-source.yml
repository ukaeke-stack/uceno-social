name: UCENO Unity Build Automation artifact handoff source checks

on:
  pull_request:
    paths:
      - "scripts/uba-upload-world-registry.sh"
      - "docs/virtual-world/UNITY_BUILD_AUTOMATION_ARTIFACT_HANDOFF.md"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/BuildCommand.cs"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldInteractableRegistryExporter.cs"
      - ".github/workflows/uba-artifact-handoff-source.yml"
  push:
    branches:
      - feature/uceno-unity-foundation
    paths:
      - "scripts/uba-upload-world-registry.sh"
      - "docs/virtual-world/UNITY_BUILD_AUTOMATION_ARTIFACT_HANDOFF.md"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/BuildCommand.cs"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldInteractableRegistryExporter.cs"
      - ".github/workflows/uba-artifact-handoff-source.yml"

jobs:
  artifact-handoff-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check uploader shell syntax
        run: bash -n scripts/uba-upload-world-registry.sh
      - name: Exercise registry validation fixtures
        run: node scripts/tests/validate-world-interactable-registry.test.mjs
      - name: Check artifact handoff contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const script = fs.readFileSync('scripts/uba-upload-world-registry.sh', 'utf8');
          const docs = fs.readFileSync('docs/virtual-world/UNITY_BUILD_AUTOMATION_ARTIFACT_HANDOFF.md', 'utf8');
          const required = [
            'ORG_ID', 'PROJECT_ID', 'BUILD_TARGET', 'UCB_BUILD_NUMBER',
            'UCENO_UBA_SERVICE_ACCOUNT_KEY_ID', 'UCENO_UBA_SERVICE_ACCOUNT_SECRET', 'world-interactables.json',
            'world-interactables.json.sha256', 'Tus-Resumable: 1.0.0',
            'application/offset+octet-stream', 'primary": false', 'public": false'
          ];
          for (const value of required) {
            if (!script.includes(value)) throw new Error('Uploader missing contract: ' + value);
          }
          if (!docs.includes('scripts/uba-upload-world-registry.sh') ||
              !docs.includes('WORLD_INTERACTABLES_FILE') ||
              !docs.includes('Manual gateway handoff')) {
            throw new Error('Unity Dashboard / gateway handoff instructions are incomplete');
          }
          console.log('UBA registry artifact handoff source contract passed');
          NODE
