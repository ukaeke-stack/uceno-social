name: UCENO Unity Build Automation artifact handoff source checks

on:
  pull_request:
    paths:
      - "scripts/uba-upload-world-registry.sh"
      - "scripts/validate-world-interactable-registry.mjs"
      - "scripts/tests/validate-world-interactable-registry.test.mjs"
      - "docs/virtual-world/UNITY_BUILD_AUTOMATION_ARTIFACT_HANDOFF.md"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/BuildCommand.cs"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldInteractableRegistryExporter.cs"
      - ".github/workflows/uba-artifact-handoff-source.yml"
      - ".github/workflows/uceno-unity-content-export.yml"
  push:
    branches:
      - feature/uceno-unity-foundation
    paths:
      - "scripts/uba-upload-world-registry.sh"
      - "docs/virtual-world/UNITY_BUILD_AUTOMATION_ARTIFACT_HANDOFF.md"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/BuildCommand.cs"
      - "unity/UCENOVirtualWorld/Assets/UCENO/Editor/WorldInteractableRegistryExporter.cs"
      - ".github/workflows/uba-artifact-handoff-source.yml"

jobs:
  artifact-handoff-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check uploader shell syntax
        run: bash -n scripts/uba-upload-world-registry.sh
      - name: Install gateway parser dependencies
        run: npm install --prefix runtime/world-gateway --ignore-scripts --no-audit --no-fund
      - name: Compile authoritative gateway parser
        run: npm --prefix runtime/world-gateway run build
      - name: Exercise registry validation fixtures against gateway parser
        run: node scripts/tests/validate-world-interactable-registry.test.mjs
      - name: Check artifact handoff contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const script = fs.readFileSync('scripts/uba-upload-world-registry.sh', 'utf8');
          const validator = fs.readFileSync('scripts/validate-world-interactable-registry.mjs', 'utf8');
          const docs = fs.readFileSync('docs/virtual-world/UNITY_BUILD_AUTOMATION_ARTIFACT_HANDOFF.md', 'utf8');
          const build = fs.readFileSync('unity/UCENOVirtualWorld/Assets/UCENO/Editor/BuildCommand.cs', 'utf8');
          const exportWorkflow = fs.readFileSync('.github/workflows/uceno-unity-content-export.yml', 'utf8');
          const required = [
            'npm --prefix "$GATEWAY_DIR" run build',
            'ORG_ID', 'PROJECT_ID', 'BUILD_TARGET', 'UCB_BUILD_NUMBER',
            'UCENO_UBA_SERVICE_ACCOUNT_KEY_ID', 'UCENO_UBA_SERVICE_ACCOUNT_SECRET', 'world-interactables.json',
            'world-interactables.json.sha256', 'Tus-Resumable: 1.0.0',
            'application/offset+octet-stream', 'primary": false', 'public": false'
          ];
          for (const value of required) {
            if (!script.includes(value)) throw new Error('Uploader missing contract: ' + value);
          }
          if (!validator.includes('parseWorldDistricts') || !validator.includes('parseInteractableRegistry')) {
            throw new Error('Registry validator must use the authoritative gateway parsers');
          }
          if (!docs.includes('scripts/uba-upload-world-registry.sh') ||
              !docs.includes('WORLD_INTERACTABLES_FILE') ||
              !docs.includes('Manual gateway handoff')) {
            throw new Error('Unity Dashboard / gateway handoff instructions are incomplete');
          }
          const exportStart = build.indexOf('public static void ExportWorldContentOnly()');
          const exportEnd = build.indexOf('// Used by the repository', exportStart);
          if (exportStart < 0 || exportEnd < 0) throw new Error('Missing isolated Editor-only export entry point');
          const exportMethod = build.slice(exportStart, exportEnd);
          for (const value of [
            'StarterSceneBuilder.CreateStarterScene()',
            'UCENO_Starter_World.unity',
            'UCENO_District_South.unity',
            'UCENO_District_Central_South.unity',
            'UCENO_District_Central_North.unity',
            'UCENO_District_North.unity',
            'world-interactables.json',
            'uceno-city-collision-boxes.json'
          ]) {
            if (!exportMethod.includes(value)) throw new Error('Content-only export missing required artifact: ' + value);
          }
          if (exportMethod.includes('BuildPipeline.BuildPlayer') ||
              exportMethod.includes('SwitchActiveBuildTarget') ||
              exportMethod.includes('BuildAndroidDevelopment')) {
            throw new Error('Content-only export must never start a player build');
          }
          if (!docs.includes('ExportWorldContentOnly') ||
              !docs.includes('does not call') ||
              !docs.includes('licensed Unity Editor runner')) {
            throw new Error('Editor-only export instructions or evidence boundary are incomplete');
          }
          if (!exportWorkflow.includes('workflow_dispatch:') ||
              !exportWorkflow.includes("vars.UCENO_UNITY_CONTENT_EXPORT_ENABLED == 'true'") ||
              !exportWorkflow.includes('UCENO.VirtualWorld.Editor.BuildCommand.ExportWorldContentOnly') ||
              !exportWorkflow.includes('targetPlatform: StandaloneLinux64') ||
              !exportWorkflow.includes('scripts/validate-world-interactable-registry.mjs') ||
              !exportWorkflow.includes('actions/upload-artifact@v4')) {
            throw new Error('Manual content-only export workflow is missing its explicit gate, Unity method, validation, or artifact upload');
          }
          if (exportWorkflow.includes('BuildAndroidDevelopment') ||
              exportWorkflow.includes('targetPlatform: Android') ||
              exportWorkflow.includes('UCENO-Virtual-World-dev.apk')) {
            throw new Error('Content-only workflow must not request or upload an Android player');
          }
          console.log('UBA registry artifact handoff source contract passed');
          NODE
