name: UCENO CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Start production build for smoke checks
        run: npm run start -- --hostname 127.0.0.1 > /tmp/uceno.log 2>&1 & echo $! > /tmp/uceno.pid
      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uceno.log
          exit 1
      - name: Verify public routes and authentication boundaries
        run: UCENO_BASE_URL=http://127.0.0.1:3000 npm run test:smoke

  android-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Install native call audio routing plugin
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const main = execFileSync('find', ['android/app/src/main/java', '-name', 'MainActivity.java', '-print', '-quit'], { encoding: 'utf8' }).trim();
          if (!main) throw new Error('Capacitor MainActivity.java was not generated');
          fs.copyFileSync('native/android/CallAudioRoutePlugin.java', path.join(path.dirname(main), 'CallAudioRoutePlugin.java'));
          fs.copyFileSync('native/android/UcenoCallMessagingService.java', path.join(path.dirname(main), 'UcenoCallMessagingService.java'));
          let source = fs.readFileSync(main, 'utf8');
          if (!source.includes('registerPlugin(CallAudioRoutePlugin.class)')) {
            if (!source.includes('import android.os.Bundle;')) source = source.replace(/package [^;]+;\s*/, match => match + '\n\nimport android.os.Bundle;');
            const declaration = 'public class MainActivity extends BridgeActivity {';
            if (!source.includes(declaration)) throw new Error('Unexpected Capacitor MainActivity template');
            source = source.replace(declaration, declaration + '\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(CallAudioRoutePlugin.class);\n        super.onCreate(savedInstanceState);\n    }');
          }
          const launchIntentHandler = `
        android.content.Intent launchIntent = getIntent();
        String launchTarget = launchIntent == null ? null : launchIntent.getStringExtra("url");
        if (launchTarget != null && getBridge() != null) {
            final String safeLaunchTarget = launchTarget.startsWith("/") && !launchTarget.startsWith("//") ? launchTarget : "/";
            getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(
                "window.location.assign(" + org.json.JSONObject.quote(safeLaunchTarget) + ")", null));
        }
`;
          if (!source.includes('String launchTarget = launchIntent == null')) {
            source = source.replace('super.onCreate(savedInstanceState);', 'super.onCreate(savedInstanceState);' + launchIntentHandler);
          }
          const newIntentHandler = `
    @Override
    protected void onNewIntent(android.content.Intent intent) {
        super.onNewIntent(intent);
        setIntent(intent);
        String target = intent.getStringExtra("url");
        if (target != null && getBridge() != null) {
            final String safeTarget = target.startsWith("/") && !target.startsWith("//") ? target : "/";
            getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(
                "window.location.assign(" + org.json.JSONObject.quote(safeTarget) + ")", null));
        }
    }
`;
          if (!source.includes('protected void onNewIntent(android.content.Intent intent)')) {
            source = source.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {' + newIntentHandler);
          }
          fs.writeFileSync(main, source);
          const manifest = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(manifest, 'utf8');
          for (const permission of ['android.permission.MODIFY_AUDIO_SETTINGS', 'android.permission.VIBRATE', 'android.permission.CAMERA', 'android.permission.RECORD_AUDIO']) {
            const declaration = '<uses-permission android:name="' + permission + '" />';
            if (!xml.includes(declaration)) xml = xml.replace('<application', '    ' + declaration + '\n    <application');
          }
          const callService = '<service android:name=".UcenoCallMessagingService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter></service>';
          if (!xml.includes('UcenoCallMessagingService')) xml = xml.replace('</application>', '        ' + callService + '\n    </application>');
          fs.writeFileSync(manifest, xml);
          NODE
      - name: Configure native Firebase for Android push
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$FIREBASE_JSON" || { echo "::error::Missing FIREBASE_GOOGLE_SERVICES_JSON secret; Android Firebase cannot initialize without the native config."; exit 1; }
          mkdir -p android/app
          printf '%s' "$FIREBASE_JSON" > android/app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))"
          node <<'NODE'
          const fs = require('fs');
          const root = 'android/build.gradle';
          let r = fs.readFileSync(root, 'utf8');
          if (!r.includes('com.google.gms:google-services')) {
            if (!r.includes('dependencies {')) throw new Error('Google Services Gradle dependency block not found');
            r = r.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'");
            fs.writeFileSync(root, r);
          }
          const file = 'android/app/build.gradle';
          let a = fs.readFileSync(file, 'utf8');
          if (!a.includes('com.google.gms.google-services')) {
            a += "\napply plugin: 'com.google.gms.google-services'\n";
            fs.writeFileSync(file, a);
          }
          const config = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const clients = config.client || [];
          if (!clients.some(c => c.client_info?.android_client_info?.package_name === 'com.ukaeke.uceno')) {
            throw new Error('google-services.json has no Android client for com.ukaeke.uceno');
          }
          console.log('Native Firebase config validated for com.ukaeke.uceno.');
          NODE
      - name: Compile Android debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uceno-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
