name: UCENO CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Start production build for smoke checks
        run: npm run start -- --hostname 127.0.0.1 > /tmp/uceno.log 2>&1 & echo $! > /tmp/uceno.pid
      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uceno.log
          exit 1
      - name: Verify public routes and authentication boundaries
        run: UCENO_BASE_URL=http://127.0.0.1:3000 npm run test:smoke

  android-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure native Firebase for Android push
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$FIREBASE_JSON" || { echo "::error::Missing FIREBASE_GOOGLE_SERVICES_JSON secret; Android Firebase cannot initialize without the native config."; exit 1; }
          mkdir -p android/app
          printf '%s' "$FIREBASE_JSON" > android/app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))"
          node <<'NODE'
          const fs = require('fs');
          const root = 'android/build.gradle';
          let r = fs.readFileSync(root, 'utf8');
          if (!r.includes('com.google.gms:google-services')) {
            if (!r.includes('dependencies {')) throw new Error('Google Services Gradle dependency block not found');
            r = r.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'");
            fs.writeFileSync(root, r);
          }
          const file = 'android/app/build.gradle';
          let a = fs.readFileSync(file, 'utf8');
          if (!a.includes('com.google.gms.google-services')) {
            a += "\napply plugin: 'com.google.gms.google-services'\n";
            fs.writeFileSync(file, a);
          }
          const config = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const clients = config.client || [];
          if (!clients.some(c => c.client_info?.android_client_info?.package_name === 'com.ukaeke.uceno')) {
            throw new Error('google-services.json has no Android client for com.ukaeke.uceno');
          }
          console.log('Native Firebase config validated for com.ukaeke.uceno.');
          NODE
      - name: Compile Android debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Launch APK on Android emulator and collect crash diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            set -eu
            mkdir -p "$GITHUB_WORKSPACE/diagnostics"
            trap 'mkdir -p "$GITHUB_WORKSPACE/diagnostics"; adb logcat -d -t 8000 > "$GITHUB_WORKSPACE/diagnostics/uceno-android-logcat.txt" 2>&1 || true; adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/diagnostics/uceno-android-activities.txt" 2>&1 || true' EXIT
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            ls -l "$APK"
            test -f "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.ukaeke.uceno 1
            sleep 25
            mkdir -p "$GITHUB_WORKSPACE/diagnostics"
            adb logcat -d -t 8000 > "$GITHUB_WORKSPACE/diagnostics/uceno-android-logcat.txt"
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/diagnostics/uceno-android-activities.txt"
            if ! adb shell pidof com.ukaeke.uceno >/dev/null 2>&1; then
              echo "::error::UCENO process exited after launch. Log excerpt:"
              grep -Ei "FATAL EXCEPTION|AndroidRuntime|com\\.ukaeke\\.uceno|chromium|Capacitor|Firebase" "$GITHUB_WORKSPACE/diagnostics/uceno-android-logcat.txt" | tail -n 180 || tail -n 180 "$GITHUB_WORKSPACE/diagnostics/uceno-android-logcat.txt"
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Process: com\\.ukaeke\\.uceno.*has died" "$GITHUB_WORKSPACE/diagnostics/uceno-android-logcat.txt"; then
              echo "::error::Android logs show a startup crash."
              exit 1
            fi
            echo "UCENO remained running for 25 seconds after launch."
      - name: Upload APK and Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uceno-android-diagnostics
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            diagnostics/uceno-android-logcat.txt
            diagnostics/uceno-android-activities.txt
          if-no-files-found: warn
          retention-days: 7
