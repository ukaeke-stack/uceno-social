name: UCENO CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Start production build for smoke checks
        run: npm run start -- --hostname 127.0.0.1 > /tmp/uceno.log 2>&1 & echo $! > /tmp/uceno.pid
      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uceno.log
          exit 1
      - name: Verify public routes and authentication boundaries
        run: UCENO_BASE_URL=http://127.0.0.1:3000 npm run test:smoke

  android-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile Android debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Launch APK on Android emulator and check for startup crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set -e
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.ukaeke.uceno 1
            sleep 25
            adb logcat -d -t 5000 > /tmp/uceno-android-logcat.txt
            if ! adb shell pidof com.ukaeke.uceno >/dev/null 2>&1; then
              echo "::error::UCENO process exited after launch. Recent Android logs:"
              grep -Ei "FATAL EXCEPTION|AndroidRuntime|com\\.ukaeke\\.uceno|chromium|Capacitor" /tmp/uceno-android-logcat.txt | tail -n 180 || tail -n 180 /tmp/uceno-android-logcat.txt
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Process: com\\.ukaeke\\.uceno.*has died" /tmp/uceno-android-logcat.txt; then
              echo "::error::Android logs show a startup crash."
              exit 1
            fi
            echo "UCENO remained running for 25 seconds after launch."
      - uses: actions/upload-artifact@v4
        with:
          name: uceno-android-debug-smoke
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
