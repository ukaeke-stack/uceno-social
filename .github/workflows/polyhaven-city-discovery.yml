name: UCENO Poly Haven city discovery checks
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/discover_polyhaven_city_assets_v2.py"
      - "scripts/tests/test_discover_polyhaven_city_assets_v2.py"
      - ".github/workflows/polyhaven-city-discovery.yml"
concurrency:
  group: uceno-polyhaven-discovery-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  discovery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile discovery code and tests
        run: python -m compileall -q scripts/discover_polyhaven_city_assets_v2.py scripts/tests/test_discover_polyhaven_city_assets_v2.py
      - name: Test city coverage and candidate matching
        run: python -m unittest scripts.tests.test_discover_polyhaven_city_assets_v2 -v
      - name: Discover live Poly Haven CC0 model candidates
        run: python scripts/discover_polyhaven_city_assets_v2.py
      - name: Preserve candidate-only discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uceno-polyhaven-city-candidate-discovery
          path: artifacts/polyhaven-city-discovery/candidates.json
          if-no-files-found: warn
          retention-days: 30
